{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team</title>
  <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
</head>
<body style="background-color: white; margin: 0; font-family: sans-serif;">

  <section style="text-align: center; padding: 40px 20px;">
    <h1 style="font-size: 2.5rem; margin-bottom: 40px;">
      Our <span style="color: #00bfff;">Team</span>
    </h1>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; max-width: 1200px; margin: auto;">
      
      <!-- Repeat this block for each person -->
      <div style="background-color: #002244; color: white; border-radius: 15px; padding: 30px; text-align: center;">
        <img src="https://via.placeholder.com/120" alt="Person" style="border-radius: 50%; border: 4px solid white; width: 120px; height: 120px;">
        <h3 style="color: #00bfff; margin: 15px 0 5px;">Joseph Brown</h3>
        <p>Marketing Head</p>
        <div style="margin-top: 15px;">
          <i>🔗 Social Icons Here</i>
        </div>
      </div>

      <!-- Duplicate the above block and change names/images as needed for all 6 people -->

    </div>
  </section>

</body>
</html>

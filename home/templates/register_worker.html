{% load static %} 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Registration</title>
    <style>
        /* Dark Theme with Red Accents */
        :root {
            --primary: #e74c3c;
            --primary-dark: #c0392b;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #333;
            --input-bg: #2a2a2a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
        }
        
        .form-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-left: 5px solid var(--primary);
        }
        
        
        h2 {
            text-align: center;
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        input, select {
            width: 100%;
            padding: 0.9rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: all 0.25s ease;
        }
        
        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.2);
        }
        
        input[type="file"] {
            padding: 0.7rem;
        }
        
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 0.5rem;
        }
        
        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }
        
        @media (max-width: 768px) {
            body {
                padding: 1.5rem;
            }
            
            .form-box {
                padding: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            
            h2 {
                font-size: 1.5rem;
            }
            
            input, select {
                padding: 0.8rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Worker Registration</h2>
            <form action="/insertworker/" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <label for="worker_name">Full Name:</label>
                <input type="text" id="worker_name" name="worker_name" required>

                <label for="worker_age">Age:</label>
                <input type="number" id="worker_age" name="worker_age" required>

<label for="worker_department">Job Department:</label>
                <input type="text" id="worker_department" name="worker_department" required>

                <label for="worker_photo">Photo:</label>
                <input type="file" id="worker_photo" name="worker_photo" accept="image/*">

                <label for="worker_email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="worker_phone">Phone:</label>
                <input type="number" id="worker_phone" name="worker_phone" required>

                <label for="worker_address">Local Address:</label>
                <input type="text" id="worker_address" name="worker_address" required>

                <button type="submit">Register Worker</button>

            </form>
        </div>
    </div>
</body>
</html>
